name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: stable

      - name: Verify formatting
        run: deno fmt --check

      - name: Run linter
        run: deno lint

      - name: Run tests
        run: deno test -A

  test-node:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - name: Setup repo
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build npm package
        run: deno run -A scripts/build_npm.ts

      - name: Install dependencies
        working-directory: ./npm
        run: npm install

      - name: Run Node.js tests
        working-directory: ./npm
        run: npm test

  test-bun:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Setup repo
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build npm package
        run: deno run -A scripts/build_npm.ts

      - name: Install dependencies
        working-directory: ./npm
        run: bun install

      - name: Run Bun tests
        working-directory: ./npm
        run: bun run test_runner.js

  tag-and-publish:
    runs-on: ubuntu-latest
    needs: [test, test-node, test-bun]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      publish: ${{ steps.tagcheck.outputs.publish }}
    steps: 
      - name:   Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: stable

      - name: Read version from deno.json
        id: ver
        run: |
          VER=$(deno eval --quiet "console.log(JSON.parse(Deno.readTextFileSync('deno.json')).version)")
          echo "ver=$VER" >> $GITHUB_OUTPUT
          echo "tag=v$VER" >> $GITHUB_OUTPUT

      - name: Ensure release tag points at HEAD
        id: tagcheck
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          HEAD_COMMIT=$(git rev-parse HEAD)
          git fetch --tags --force

          if git rev-parse --verify "$TAG" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
              echo "Tag $TAG already exists at $TAG_COMMIT, but HEAD is $HEAD_COMMIT. Bump deno.json version before publishing."
              exit 1
            fi
            echo "publish=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG (from deno.json)"
          git push origin "$TAG"
          echo "publish=true" >> $GITHUB_OUTPUT

  jsr:
    runs-on: ubuntu-latest
    needs: tag-and-publish
    if: needs.tag-and-publish.outputs.publish == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: stable
      - name: Publish package (JSR)
        run: deno publish

  npm:
    runs-on: ubuntu-latest
    needs: tag-and-publish
    if: needs.tag-and-publish.outputs.publish == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: stable
      - name: setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Build npm package
        run: deno run -A scripts/build_npm.ts

      - name: Publish package (npm)
        run: npm publish --provenance --access public
        working-directory: ./npm
        env:
          NODE_AUTH_TOKEN: ""
