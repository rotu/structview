name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Use the OS certificate store so Deno and Node.js tooling trust any
# TLS-inspecting proxies that may be present (e.g. in corporate networks
# or act-based local CI runs).
# - DENO_TLS_CA_STORE=system: uses the OS trust store for Deno's TLS
# - NODE_EXTRA_CA_CERTS: appends the OS bundle to Node's built-in store;
#   /etc/ssl/certs/ca-certificates.crt is the standard path on all
#   Debian/Ubuntu systems (ubuntu-latest and catthehacker/ubuntu:act-*)
env:
  DENO_TLS_CA_STORE: system
  NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v6

      - name: Install Deno
        run: |
          curl -fsSL \
            "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip" \
            -o /tmp/deno.zip
          sudo unzip -o /tmp/deno.zip deno -d /usr/local/bin/
          deno --version

      - name: Verify formatting
        run: deno fmt --check

      - name: Run linter
        run: deno lint

      - name: Run tests
        run: deno test -A

  test-node:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - name: Setup repo
        uses: actions/checkout@v6

      - name: Install Deno
        run: |
          curl -fsSL \
            "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip" \
            -o /tmp/deno.zip
          sudo unzip -o /tmp/deno.zip deno -d /usr/local/bin/
          deno --version

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      # The npm build uses @deno/dnt from jsr.io.  Check availability first so
      # the remaining steps can be skipped gracefully in network-restricted
      # environments (e.g. when running locally under `act` without JSR access).
      - name: Check JSR availability
        id: jsr
        run: |
          if curl -fsSL --max-time 5 -o /dev/null "https://jsr.io/@deno/dnt/meta.json" 2>/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "JSR registry not reachable; skipping npm build and tests."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build npm package
        if: steps.jsr.outputs.available == 'true'
        run: deno run -A scripts/build_npm.ts

      - name: Install dependencies
        if: steps.jsr.outputs.available == 'true'
        working-directory: ./npm
        run: npm install

      - name: Run Node.js tests
        if: steps.jsr.outputs.available == 'true'
        working-directory: ./npm
        run: npm test

  test-bun:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Setup repo
        uses: actions/checkout@v6

      - name: Install Deno
        run: |
          curl -fsSL \
            "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip" \
            -o /tmp/deno.zip
          sudo unzip -o /tmp/deno.zip deno -d /usr/local/bin/
          deno --version

      - name: Install Bun
        run: |
          curl -fsSL \
            "https://github.com/oven-sh/bun/releases/latest/download/bun-linux-x64.zip" \
            -o /tmp/bun.zip
          sudo unzip -oj /tmp/bun.zip 'bun-linux-x64/bun' -d /usr/local/bin/
          bun --version

      # The npm build uses @deno/dnt from jsr.io.  Check availability first so
      # the remaining steps can be skipped gracefully in network-restricted
      # environments (e.g. when running locally under `act` without JSR access).
      - name: Check JSR availability
        id: jsr
        run: |
          if curl -fsSL --max-time 5 -o /dev/null "https://jsr.io/@deno/dnt/meta.json" 2>/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "JSR registry not reachable; skipping npm build and tests."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build npm package
        if: steps.jsr.outputs.available == 'true'
        run: deno run -A scripts/build_npm.ts

      - name: Install dependencies
        if: steps.jsr.outputs.available == 'true'
        working-directory: ./npm
        run: bun install

      - name: Run Bun tests
        if: steps.jsr.outputs.available == 'true'
        working-directory: ./npm
        run: bun run test_runner.js

  tag-and-publish:
    runs-on: ubuntu-latest
    needs: [test, test-node, test-bun]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      publish: ${{ steps.tagcheck.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Deno
        run: |
          curl -fsSL \
            "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip" \
            -o /tmp/deno.zip
          sudo unzip -o /tmp/deno.zip deno -d /usr/local/bin/
          deno --version

      - name: Read version from deno.json
        id: ver
        run: |
          VER=$(deno eval --quiet "console.log(JSON.parse(Deno.readTextFileSync('deno.json')).version)")
          echo "ver=$VER" >> $GITHUB_OUTPUT
          echo "tag=v$VER" >> $GITHUB_OUTPUT

      - name: Ensure release tag points at HEAD
        id: tagcheck
        run: |
          # Skip tag/publish operations when running locally under act.
          # act sets ACT=true in the container environment.
          if [ "${ACT:-}" = "true" ]; then
            echo "Skipping tag and publish steps when running under act."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="${{ steps.ver.outputs.tag }}"
          HEAD_COMMIT=$(git rev-parse HEAD)
          git fetch --tags --force

          if git rev-parse --verify "$TAG" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
              echo "Tag $TAG already exists at $TAG_COMMIT, but HEAD is $HEAD_COMMIT. Bump deno.json version before publishing."
              exit 1
            fi
            echo "publish=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG (from deno.json)"
          git push origin "$TAG"
          echo "publish=true" >> $GITHUB_OUTPUT

  jsr:
    runs-on: ubuntu-latest
    needs: tag-and-publish
    if: needs.tag-and-publish.outputs.publish == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Install Deno
        run: |
          curl -fsSL \
            "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip" \
            -o /tmp/deno.zip
          sudo unzip -o /tmp/deno.zip deno -d /usr/local/bin/
          deno --version
      - name: Publish package (JSR)
        run: deno publish

  npm:
    runs-on: ubuntu-latest
    needs: tag-and-publish
    if: needs.tag-and-publish.outputs.publish == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Install Deno
        run: |
          curl -fsSL \
            "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip" \
            -o /tmp/deno.zip
          sudo unzip -o /tmp/deno.zip deno -d /usr/local/bin/
          deno --version
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Build npm package
        run: deno run -A scripts/build_npm.ts

      - name: Publish package (npm)
        run: npm publish --provenance --access public
        working-directory: ./npm
        env:
          NODE_AUTH_TOKEN: ""
