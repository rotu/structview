name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate source and package outputs
        run: |
          ./node_modules/.bin/vp run check
          ./node_modules/.bin/jsr publish --dry-run --allow-dirty
  test-node:
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - run: node ./node_modules/vitest/vitest.mjs run
  test-bun:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run ./node_modules/vitest/vitest.mjs run
  test-deno:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: latest
          cache: true
      - name: Install dependencies
        run: deno install --frozen --node-modules-dir=auto
      - run: deno run -A ./node_modules/vitest/vitest.mjs run
  test-workers:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - run: node ./node_modules/vitest/vitest.mjs run --config ./vitest.workers.config.ts
