name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type when version is not provided
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: Explicit release version (overrides bump)
        required: false
        type: string
      publish:
        description: Publish to JSR and npm (false runs dry-run commands)
        required: true
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  DENO_VERSION: latest
  NPM_DIR: ./npm

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: deno run -A scripts/pipeline.ts release
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
          NPM_DIR: ${{ env.NPM_DIR }}
          GITHUB_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ""
